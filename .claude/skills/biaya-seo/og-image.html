<!doctype html>
<!-- Plantilla de la imagen para redes (1200x630). Regenerar con el comando de SKILL.md -->
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@800&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#07090c;}
  .c{position:relative;width:1200px;height:630px;box-sizing:border-box;padding:72px 80px;color:#f4f6f8;font-family:Inter,sans-serif;overflow:hidden}
  .glow{position:absolute;border-radius:50%;filter:blur(110px);opacity:.35}
  .g1{width:560px;height:420px;right:-120px;top:-140px;background:#00cbae}
  .g2{width:520px;height:380px;right:180px;bottom:-260px;background:#2bd46a;opacity:.22}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at 70% 30%,#000 10%,transparent 70%)}
  .brand{position:relative;display:flex;align-items:center;gap:16px;font:800 40px/1 "Plus Jakarta Sans",sans-serif;letter-spacing:-.02em}
  .mark{width:56px;height:56px;background:linear-gradient(100deg,#2bd46a,#00cbae);-webkit-mask:url(../../../images/biaya-solid.svg) center/contain no-repeat}
  .pill{position:relative;display:inline-block;margin-top:70px;font:500 18px/1 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#2bd46a;border:1px solid rgba(43,212,106,.35);padding:10px 16px;border-radius:999px}
  h1{position:relative;margin:28px 0 0;font:800 76px/1.04 "Plus Jakarta Sans",sans-serif;letter-spacing:-.035em;max-width:980px}
  .grad{background:linear-gradient(100deg,#2bd46a,#00cbae);-webkit-background-clip:text;background-clip:text;color:transparent}
  .foot{position:absolute;left:80px;right:80px;bottom:64px;display:flex;justify-content:space-between;font:500 22px/1 "JetBrains Mono",monospace;color:rgba(244,246,248,.6)}
</style></head><body><div class="c">
  <div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>
  <div class="brand"><span class="mark"></span>Biaya</div>
  <span class="pill">Consultoría de ingeniería enterprise con IA</span>
  <h1>Ingeniería enterprise.<br>Velocidad de la IA.<br><span class="grad">Control tuyo.</span></h1>
  <div class="foot"><span>biaya.mx</span><span>AI Factory · software enterprise</span></div>
</div></body></html>
